# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: jingyang647git-blog
subtitle: ''
description: '演示博客'
keywords:
author: pnqll
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
# If your site is put in a subdirectory, set url as 'http://example.com/child' and root as '/child/'
url: https://www.sovely.cn
root: /
permalink: :year/:month/:day/:abbrlink/
permalink_defaults:

# 文章短链（hexo-abbrlink）：首次生成后写回 front-matter，之后永久不变
abbrlink:
  alg: crc32   # 算法 crc16（短）/ crc32（更不易撞）
  rep: dec     # 进制 dec（十进制）/ hex（十六进制更短）
  drafts: false
  force: false # true = 每次构建强制重算（会改变链接，勿开）
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'empty'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
# Plugins: https://hexo.io/plugins/
theme: butterfly

# 本地搜索数据（hexo-generator-searchdb）
search:
  path: search.xml
  field: post
  format: html
  content: true
  limit: 10000

# 看板娘（hexo-helper-live2d）2026-10-29 应需求关闭
live2d:
  enable: false
  scriptFrom: local
  pluginRootPath: live2dw/
  pluginJsPath: lib/
  pluginModelPath: assets/
  tagMode: false
  debug: false
  model:
    use: live2d-widget-model-koharu
  display:
    position: right
    width: 150
    height: 300
    hOffset: 0
    vOffset: -20
  mobile:
    show: false
  react:
    opacity: 0.9
  log: false

# Deployment
# 生成产物推到 GitHub，由 Vercel 构建/托管并绑定 sovely.cn
deploy:
  type: git
  repo: https://github.com/jingyang647git/jingyang647git.github.io.git
  branch: main
  message: 'Site updated'
